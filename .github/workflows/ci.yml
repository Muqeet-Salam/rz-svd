name: rz-svd

on:
  push:
    branches: [ wrkflw ]
  pull_request:
    branches: [ wrkflw ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-wheel \
            python3-setuptools \
            python3-dev \
            meson \
            ninja-build \
            git

      - name: Clone Rizin
        run: |
          git clone --depth 1 --branch rzsvdwrap https://github.com/Muqeet-Salam/rizin.git

      - name: Checkout rz-svd into Rizin subprojects
        uses: actions/checkout@v3
        with:
          path: rizin/subprojects/rz-svd

      - name: Build Rizin (with rz-svd subproject)
        run: |
          cd rizin
          meson setup build --buildtype=release --prefix=/usr
          ninja -C build

      - name: Install
        run: |
          cd rizin
          sudo ninja -C build install

      - name: Verify rz-svd library is installed
        run: |
          ldconfig -p | grep librz_svd
          test -f /usr/lib/x86_64-linux-gnu/librz_svd.so